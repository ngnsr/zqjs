# Minimal manual-only Windows native build & test check.
# Triggered only via workflow_dispatch (1 job, never runs automatically on push/PR).
name: Windows Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          cache-key: windows-check

      - name: Formatting
        run: zig fmt --check .

      - name: Build CLI + libzqjs
        run: zig build --summary all

      - name: CLI smoke test
        shell: bash
        run: |
          out=$(./zig-out/bin/zqjs.exe -e "print(1 + 2, new Date(0).toISOString());")
          echo "$out"
          test "$out" = "3 1970-01-01T00:00:00.000Z"

      - name: Tests (ReleaseSafe)
        run: zig build test -j2 --summary all

      - name: pow portability hash
        shell: bash
        run: |
          expected=b02251ea683f1d7d845373dba7eba1a0aa02f8253761095beb95de2a03ab2b19
          out=$(zig build pow-bits -- tests/ops/pow.jsonl)
          echo "$out"
          grep -q "$expected" <<< "$out" || { echo "pow results differ from the reference hash"; exit 1; }
