# Runs on pushes and pull requests that touch code, tests, tools, or the build.
# Docs-only changes (*.md) skip CI.
name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - "build.zig"
      - "build.zig.zon"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - "build.zig"
      - "build.zig.zon"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.platform.name }} / ${{ matrix.suite.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macOS arm64, os: macos-latest, cpu: "" }
          - { name: Linux x86_64, os: ubuntu-latest, cpu: "-Dcpu=x86_64_v3" }
          - { name: Linux arm64, os: ubuntu-24.04-arm, cpu: "" }
          - { name: Windows x86_64, os: windows-latest, cpu: "-Dcpu=x86_64_v3" }
        suite:
          # build.zig defaults to ReleaseSafe.
          - { name: tests, flags: "" }
          - { name: gc-stress + stack-stress, flags: "-Dgc-stress -Dstack-stress" }
    steps:
      - uses: actions/checkout@v4

      # Exact toolchain pin (DESIGN_DECISIONS D17); build.zig refuses other versions.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          cache-key: ${{ matrix.suite.name }}

      - name: Formatting
        if: matrix.suite.name == 'tests'
        run: zig fmt --check .

      - name: Tests (${{ matrix.suite.name }})
        run: zig build test -j2 ${{ matrix.suite.flags }} ${{ matrix.platform.cpu }} --summary all

      # M8.1: each deliberately broken GC mutant must be caught by the heap verifier.
      - name: GC mutants
        if: matrix.suite.name == 'tests'
        run: zig build gc-mutants -j2 ${{ matrix.platform.cpu }} --summary all

      # Verify syntax/diff/pow goldens against pinned arm64 Node 26.
      - if: matrix.suite.name == 'tests' && matrix.platform.os == 'macos-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Generated files and Node contract
        if: matrix.suite.name == 'tests' && matrix.platform.os == 'macos-latest'
        run: zig build check-goldens

      - name: Release build & embedding example
        if: matrix.suite.name == 'tests'
        run: |
          zig build -Doptimize=ReleaseFast ${{ matrix.platform.cpu }}
          zig build example -Doptimize=ReleaseFast ${{ matrix.platform.cpu }}

      # pow must give bit-identical results everywhere (DESIGN_DECISIONS D25).
      - name: pow portability hash
        if: matrix.suite.name == 'tests'
        shell: bash
        run: |
          expected=b02251ea683f1d7d845373dba7eba1a0aa02f8253761095beb95de2a03ab2b19
          out=$(zig build pow-bits -- tests/ops/pow.jsonl)
          echo "$out"
          grep -q "$expected" <<< "$out" || { echo "pow results differ from the reference hash"; exit 1; }
