# Runs on pushes and pull requests that touch code, tests, tools, or the build.
# Docs-only changes (*.md) skip CI.
name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - "build.zig"
      - "build.zig.zon"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - "build.zig"
      - "build.zig.zon"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.platform.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macOS arm64, os: macos-latest, cpu: "", jobs: "-j2" }
          - { name: Linux x86_64, os: ubuntu-latest, cpu: "-Dcpu=x86_64_v3", jobs: "-j4" }
          - { name: Linux arm64, os: ubuntu-24.04-arm, cpu: "", jobs: "-j4" }
          - { name: Windows x86_64, os: windows-latest, cpu: "-Dcpu=x86_64_v3", jobs: "-j4" }
    steps:
      - uses: actions/checkout@v4

      # Exact toolchain pin (DESIGN_DECISIONS D17); build.zig refuses other versions.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          cache-key: tests

      - name: Formatting
        run: zig fmt --check .

      - name: Tests (ReleaseSafe)
        run: zig build test ${{ matrix.platform.jobs }} ${{ matrix.platform.cpu }} --summary all

      # Verify syntax/diff/pow goldens against pinned arm64 Node 26.
      - if: matrix.platform.os == 'macos-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Generated files and Node contract
        if: matrix.platform.os == 'macos-latest'
        run: zig build check-goldens

      - name: Release build & embedding example
        run: |
          zig build ${{ matrix.platform.jobs }} -Doptimize=ReleaseFast ${{ matrix.platform.cpu }}
          zig build example ${{ matrix.platform.jobs }} -Doptimize=ReleaseFast ${{ matrix.platform.cpu }}

      # pow must give bit-identical results everywhere (DESIGN_DECISIONS D25).
      - name: pow portability hash
        shell: bash
        run: |
          expected=b02251ea683f1d7d845373dba7eba1a0aa02f8253761095beb95de2a03ab2b19
          out=$(zig build pow-bits -- tests/ops/pow.jsonl)
          echo "$out"
          grep -q "$expected" <<< "$out" || { echo "pow results differ from the reference hash"; exit 1; }

  # GC/stack stress + M8.1 verifier mutants (run once on fast Linux x86_64).
  gc-stress:
    name: GC Stress & Mutants (Linux x86_64)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          cache-key: gc-stress-mutants

      - name: Tests (gc-stress + stack-stress)
        run: zig build test -j4 -Dgc-stress -Dstack-stress -Dcpu=x86_64_v3 --summary all

      - name: GC mutants
        run: zig build gc-mutants -j4 -Dcpu=x86_64_v3 --summary all

  wasm:
    name: WASM (wasm32-wasi)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          cache-key: wasm32-wasi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build zqjs.wasm & libzqjs.a (ReleaseSmall)
        run: zig build -j4 -Dtarget=wasm32-wasi -Doptimize=ReleaseSmall --summary all

      - name: Smoke-test zqjs.wasm via node:wasi
        run: |
          node --no-warnings -e '
          const fs = require("fs");
          const { WASI } = require("node:wasi");
          (async () => {
            const wasm = await WebAssembly.compile(fs.readFileSync("zig-out/bin/zqjs.wasm"));
            const cases = [
              { code: "function fib(n){return n<2?n:fib(n-1)+fib(n-2);} print(fib(20));", exit: 0 },
              { code: "const p = new Proxy({x:21},{get(t,k){return t[k]*2;}}); print(p.x, (2n**64n).toString());", exit: 0 },
              { code: "print(/\\p{Script=Cyrillic}+/u.test(\"Привіт\"), 2**53-1);", exit: 0 },
              { code: "async function f(){ return await Promise.resolve(42); } f().then(print);", exit: 0 },
              { code: "while(true){}", exit: 1 },
            ];
            for (const c of cases) {
              const wasi = new WASI({ version: "preview1", args: ["zqjs", "--max-steps", "500000", "-e", c.code] });
              const inst = await WebAssembly.instantiate(wasm, wasi.getImportObject());
              const rc = wasi.start(inst);
              if (rc !== c.exit) {
                console.error("WASM test failed:", c.code, "expected", c.exit, "got", rc);
                process.exit(1);
              }
            }
            console.log("WASM WASI smoke tests passed!");
          })();
          '
