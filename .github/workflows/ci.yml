# Runs on pushes and pull requests that touch code, tests, tools or the build.
# Same commands as a local check (see README). Docs-only changes (*.md) skip CI.
name: CI

# Allowlist, not a *.md ignore list: other non-code files stay out of CI by default.
# Keep both lists in sync.
on:
  push:
    branches: ["**"] # not tags: a tag points at a commit CI already checked
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/ci.yml"
  workflow_dispatch: # manual run from the Actions tab

# A newer push to the same branch cancels the older run (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # One job per (platform, test configuration), all in parallel: the configurations are
    # independent builds, and run one after another they took ~7 min a platform.
    name: ${{ matrix.platform.name }} / ${{ matrix.suite.name }}
    # A same-repo PR branch is already checked by its push run; only fork PRs need their own.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # one job failing shouldn't hide the others' results
      matrix:
        platform:
          - { name: macOS arm64, os: macos-latest }
          - { name: Linux x86_64, os: ubuntu-latest }
          # GitHub's arm64 Linux runners are free for public repositories; for a private
          # repository this job may need a paid runner (or remove it).
          - { name: Linux arm64, os: ubuntu-24.04-arm }
        # Both stress modes at once: the VM moves its stacks on every call (D36), and both
        # engines collect at every safepoint, keep collected objects as tombstones and
        # verify the heap before and after every collection (D8, GC_DESIGN §11).
        # ReleaseSafe checks the tree-walker's measured stack use in another mode (D37),
        # and that the stress checks don't exist only in Debug.
        suite:
          - { name: tests, flags: "" }
          - { name: gc-stress + stack-stress, flags: "-Dgc-stress -Dstack-stress" }
          - { name: ReleaseSafe, flags: "-Doptimize=ReleaseSafe" }
          - { name: gc-stress ReleaseSafe, flags: "-Dgc-stress -Doptimize=ReleaseSafe" }
    steps:
      - uses: actions/checkout@v4

      # Exact toolchain pin (DESIGN_DECISIONS D17); build.zig also refuses other versions.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          # One Zig cache per test configuration (the OS is already in the key): with a
          # shared key each job restored whichever configuration saved last, and recompiled.
          cache-key: ${{ matrix.suite.name }}

      - name: Tests (${{ matrix.suite.name }})
        run: zig build test ${{ matrix.suite.flags }} --summary all

      # The checks below run once per platform, in the plain-tests job.

      # Dev-time tools for check-goldens: node (goldens, syntax contract) and Python 3
      # (pow reference values; standard library only, preinstalled on the runners).
      - if: matrix.suite.name == 'tests'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Formatting
        if: matrix.suite.name == 'tests'
        run: zig fmt --check .

      # M8.1: each deliberately broken GC piece must be caught by the heap verifier.
      - name: GC mutants
        if: matrix.suite.name == 'tests'
        run: zig build gc-mutants --summary all

      - name: Generated files and node contract
        if: matrix.suite.name == 'tests'
        run: zig build check-goldens

      - name: Release build
        if: matrix.suite.name == 'tests'
        run: zig build --release=fast

      # pow must give bit-identical results everywhere (DESIGN_DECISIONS D25). The expected
      # hash was measured on aarch64-macos and x86_64 under Rosetta 2; these runners add
      # real x86_64 and arm64 Linux hardware.
      - name: pow portability hash
        if: matrix.suite.name == 'tests'
        shell: bash
        run: |
          expected=b02251ea683f1d7d845373dba7eba1a0aa02f8253761095beb95de2a03ab2b19
          out=$(zig build pow-bits -- tests/ops/pow.jsonl)
          echo "$out"
          grep -q "$expected" <<< "$out" || { echo "pow results differ from the reference hash"; exit 1; }
