# Runs on pushes and pull requests that touch code, tests, tools or the build.
# Same commands as a local check (see README). Docs-only changes (*.md) skip CI.
name: CI

# Allowlist, not a *.md ignore list: other non-code files stay out of CI by default.
# Keep both lists in sync.
on:
  push:
    branches: ["**"] # not tags: a tag points at a commit CI already checked
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/ci.yml"
  workflow_dispatch: # manual run from the Actions tab

# A newer push to the same branch cancels the older run (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    # A same-repo PR branch is already checked by its push run; only fork PRs need their own.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # one platform failing shouldn't hide the others' results
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Linux x86_64, os: ubuntu-latest }
          # GitHub's arm64 Linux runners are free for public repositories; for a private
          # repository this job may need a paid runner (or remove it).
          - { name: Linux arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      # Exact toolchain pin (DESIGN_DECISIONS D17); build.zig also refuses other versions.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # Dev-time tools for check-goldens: node (goldens, syntax contract) and Python 3
      # (pow reference values; standard library only, preinstalled on the runners).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Formatting
        run: zig fmt --check .

      - name: Tests (unit + integration)
        run: zig build test --summary all

      # The VM moves its stacks on every call (stale indices fail at once, DESIGN_DECISIONS
      # D36); ReleaseSafe checks the tree-walker's measured stack use in another mode (D37).
      - name: Tests under -Dstack-stress
        run: zig build test -Dstack-stress --summary all

      - name: Tests in ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Generated files and node contract
        run: zig build check-goldens

      - name: Release build
        run: zig build --release=fast

      # pow must give bit-identical results everywhere (DESIGN_DECISIONS D25). The expected
      # hash was measured on aarch64-macos and x86_64 under Rosetta 2; these runners add
      # real x86_64 and arm64 Linux hardware.
      - name: pow portability hash
        shell: bash
        run: |
          expected=b02251ea683f1d7d845373dba7eba1a0aa02f8253761095beb95de2a03ab2b19
          out=$(zig build pow-bits -- tests/ops/pow.jsonl)
          echo "$out"
          grep -q "$expected" <<< "$out" || { echo "pow results differ from the reference hash"; exit 1; }
